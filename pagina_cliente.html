<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Assinatura do RDO — Albano</title>
<style>
:root{--azul:#1F3D21;--azul-d:#14290f;--verde:#D7E63A;--verde-d:#b9c72e;--tinta:#1a2230;--cinza:#6b7280;--linha:#d8dde5;--bg:#f4f6f9;--rad:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tinta);font-size:16px;line-height:1.45;padding-bottom:110px}
header{background:var(--azul);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header img{height:30px}
header .t{color:#fff;font-weight:700;font-size:15px}header .t small{display:block;font-weight:400;font-size:11px;color:#b9c7da}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--linha);border-radius:var(--rad);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,40,80,.05)}
.card h2{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--azul);font-weight:700;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:18px;height:3px;background:var(--verde);border-radius:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef1f5;font-size:14px}
.kv:last-child{border-bottom:none}.kv .k{color:var(--cinza);font-weight:600}.kv .v{text-align:right;font-weight:600}
label{display:block;font-size:12px;font-weight:600;color:var(--cinza);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;padding:13px 12px;border:1.5px solid var(--linha);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--tinta)}
input:focus{outline:none;border-color:var(--azul)}
.sigwrap{position:relative}
.sigbox{border:2px dashed var(--linha);border-radius:12px;background:#fafbfc;touch-action:none;display:block;width:100%;height:180px}
.sigph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b3bcc9;font-size:14px;pointer-events:none}
.sigph.hide{display:none}
.barbtn{display:flex;gap:8px;margin-top:8px}
.barbtn button{flex:1;padding:10px;border:1.5px solid var(--linha);background:#fff;border-radius:9px;font-size:13px;font-weight:600;color:var(--cinza);cursor:pointer}
.hint{font-size:12px;color:var(--cinza);margin-top:8px;line-height:1.4}
.fab{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);padding:12px 16px;z-index:40;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.fab .max{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:15px;border:none;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.btn-2{background:var(--verde);color:var(--azul-d)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.err{background:#fff;border:1px solid #f3c2c2;border-radius:12px;padding:20px;color:#a33;text-align:center;margin:20px}
@media print{body{background:#fff}header,.fab,.wrap{display:none!important}}
#doc{display:none}
@media print{
  #doc{display:block;font-size:11px;color:#000}
  .d-head{display:flex;align-items:center;gap:14px;padding:8px 4px 12px;border-bottom:2px solid var(--azul)}
  .d-head img{height:40px}.d-head .dt{color:var(--azul)}.d-head .dt b{font-size:15px}.d-head .dt small{display:block;font-size:9px;color:#5a7a4d}
  .d-meta{width:100%;border-collapse:collapse;margin-top:9px}
  .d-meta td{border:1px solid #999;padding:4px 7px;vertical-align:top;font-size:10.5px}
  .d-lbl{background:#dde6f3;font-weight:700;width:78px;white-space:nowrap}
  .d-sec{background:var(--azul);color:#fff;font-weight:700;padding:4px 8px;margin-top:8px;border-radius:4px;font-size:10.5px;letter-spacing:.5px}
  .d-sign{display:flex;gap:30px;margin-top:22px}.d-sign .s{flex:1;text-align:center}
  .d-sign img{height:55px;display:block;margin:0 auto 4px}
  .d-sign .ln{border-top:1px solid #000;padding-top:4px;font-size:9.5px}
  .d-foot{margin-top:14px;font-size:8px;color:#555;border-top:1px solid #ccc;padding-top:5px;text-align:center}
}
</style>
</head>
<body>
<header><img id="hlogo" alt="Albano"><div class="t">Assinatura do RDO<small>RELATÓRIO DIÁRIO DE OBRA</small></div></header>
<div class="wrap" id="app">
  <div class="card" id="resumo"><h2>Resumo do serviço</h2><div id="kvs"></div></div>
  <div class="card">
    <h2>Sua assinatura</h2>
    <label>Seu nome (responsável pela obra)</label>
    <input id="respNome" placeholder="digite seu nome">
    <label style="margin-top:10px">Seu e-mail (opcional — para receber uma cópia)</label>
    <input id="respEmail" type="email" placeholder="seu@email.com">
    <label style="margin-top:10px">Assine com o dedo no quadro abaixo</label>
    <div class="sigwrap"><canvas id="sig" class="sigbox"></canvas><div class="sigph" id="sigph">toque aqui e assine</div></div>
    <div class="barbtn"><button onclick="clearSig()">Limpar</button></div>
    <p class="hint">Ao assinar, ficam registrados seu nome e a data/hora do aceite no documento, confirmando o recebimento do serviço descrito acima (MP 2.200-2/2001).</p>
  </div>
</div>
<div id="doc"></div>
<div class="fab" id="fab"><div class="max"><button class="btn btn-2" onclick="gerar()">Assinar e gerar PDF</button></div></div>
<div class="toast" id="toast"></div>

document.getElementById('hlogo').src=LOGO_DATA;
let R=null, st={sigData:null,sigTime:null};

function decode(){
  try{
    const h=location.hash.slice(1);
    const m=new URLSearchParams(h).get('d');
    if(!m) return null;
    return JSON.parse(decodeURIComponent(escape(atob(m.replace(/-/g,'+').replace(/_/g,'/')))));
  }catch(e){return null}
}
function row(k,v){return `<div class="kv"><span class="k">${k}</span><span class="v">${v||'—'}</span></div>`}
function init(){
  R=decode();
  if(!R){document.getElementById('app').innerHTML='<div class="err">Link inválido ou incompleto.<br>Peça ao topógrafo para reenviar o link de assinatura.</div>';document.getElementById('fab').style.display='none';return}
  const k=document.getElementById('kvs');
  k.innerHTML=row('Empresa',R.emp)+row('Data',R.data)+row('Cliente',R.cli)+row('Obra',R.obra)+row('Local',R.local)+row('Técnico',R.tecnico)
    +row('Atividades',(R.ativ||[]).join(', '))+(R.desc?row('Descrição',R.desc):'')+row('Unidade',R.unid);
  setTimeout(fitCanvas,60);
}
const cv=document.getElementById('sig'),ph=document.getElementById('sigph');let ctx,drawing=false,last=null;
function fitCanvas(){const r=cv.getBoundingClientRect();const dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14290f'}
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function s(e){drawing=true;ph.classList.add('hide');last=pos(e);e.preventDefault()}
function mv(e){if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;e.preventDefault()}
function en(){if(!drawing)return;drawing=false;st.sigData=cv.toDataURL('image/png');st.sigTime=new Date()}
['mousedown','touchstart'].forEach(ev=>cv.addEventListener(ev,s,{passive:false}));
['mousemove','touchmove'].forEach(ev=>cv.addEventListener(ev,mv,{passive:false}));
['mouseup','touchend','mouseleave'].forEach(ev=>cv.addEventListener(ev,en));
function clearSig(){ctx.clearRect(0,0,cv.width,cv.height);st.sigData=null;st.sigTime=null;ph.classList.remove('hide')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function montarDoc(){
  const nome=document.getElementById('respNome').value.trim()||'Responsável pela obra';
  const info=st.sigTime?`aceite em ${st.sigTime.toLocaleString('pt-BR')}`:'';
  const ativ=(R.ativ||[]).map(a=>'• '+a).join('<br>')||'—';
  const tecNome=R.tecnico||R.rt||'';
  const tInfo=R.sigTtime?`assinado em ${R.sigTtime}`:('Técnico · '+(R.reg||''));
  document.getElementById('doc').innerHTML=`
   <div class="d-head"><img src="${LOGO_PDF}"><div class="dt"><b>RELATÓRIO DIÁRIO DE OBRA — RDO</b><small>${R.emp||''} · ${R.reg||''}</small></div></div>
   <table class="d-meta">
     <tr><td class="d-lbl">Data</td><td>${R.data||'—'}</td><td class="d-lbl">Cliente</td><td>${R.cli||'—'}</td></tr>
     <tr><td class="d-lbl">Obra</td><td>${R.obra||'—'}</td><td class="d-lbl">Local</td><td>${R.local||'—'}</td></tr>
     <tr><td class="d-lbl">Técnico</td><td>${tecNome}</td><td class="d-lbl">Horários</td><td>${R.hor||'—'}</td></tr>
     <tr><td class="d-lbl">Integrantes</td><td colspan="3">${R.equipe||'—'}</td></tr>
   </table>
   <div class="d-sec">ATIVIDADES EXECUTADAS</div>
   <table class="d-meta"><tr><td style="width:50%">${ativ}</td><td>${R.desc||''}</td></tr></table>
   <div class="d-sec">CLIMA E MEDIÇÃO</div>
   <table class="d-meta"><tr><td class="d-lbl">Clima</td><td>${R.clima||'—'}</td><td class="d-lbl">Praticab.</td><td>${R.prat||'—'}</td></tr>
     <tr><td class="d-lbl">Unidade</td><td>${R.unid||'—'}</td><td class="d-lbl">Qtd</td><td>1</td></tr></table>
   <div class="d-sign">
     <div class="s">${R.sigT?`<img src="${R.sigT}">`:'<div style="height:55px"></div>'}<div class="ln"><b>${tecNome}</b><br>${tInfo}</div></div>
     <div class="s">${st.sigData?`<img src="${st.sigData}">`:'<div style="height:55px"></div>'}<div class="ln"><b>${nome}</b><br>${info}</div></div>
   </div>
   <div class="d-foot">Documento assinado digitalmente. Assinaturas do técnico e do responsável com data/hora registradas (MP 2.200-2/2001).</div>`;
}
async function enviarEscritorio(nome){
  if(!R.web3) return false;
  const respEmail=document.getElementById('respEmail').value.trim();
  const fd={access_key:R.web3, subject:`RDO ${R.obra||R.cli} — ${R.data} (assinado)`,
    from_name:`RDO Albano — ${nome}`, email:R.admEmail||'',
    Data:R.data,Cliente:R.cli,Obra:R.obra,Local:R.local,Tecnico:R.tecnico||R.rt,
    Integrantes:R.equipe,Horarios:R.hor,Atividades:(R.ativ||[]).join(', '),Descricao:R.desc||'',
    Clima:R.clima,Praticabilidade:R.prat,Unidade:R.unid,Qtd:'1',
    Responsavel:nome, Email_responsavel:respEmail,
    LinhaPlanilha:[R.data,R.cli,R.obra,R.local,R.tecnico,R.equipe,(R.ativ||[]).join('; '),R.desc||'',R.clima,R.prat,R.unid,'1'].join(' | ')};
  if(respEmail) fd.cc=respEmail;
  try{const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(fd)});const j=await r.json();return j.success}catch(e){return false}
}
async function gerar(){
  if(!document.getElementById('respNome').value.trim()){toast('Digite seu nome');return}
  if(!st.sigData){toast('Assine no quadro antes de gerar');return}
  const nome=document.getElementById('respNome').value.trim();
  montarDoc();
  const ok=await enviarEscritorio(nome);
  setTimeout(()=>{window.print();toast(ok?'Enviado ao escritório ✓ — salve/encaminhe o PDF':'Salve o PDF e envie ao topógrafo');},150);
}
init();
</script>
